server {
  listen 80;
  listen [::]:80;
  server_name admin.cofarm.farm;

  root /var/www/repos/cofarm/apps/admin/dist;
  index index.html;

  access_log /var/log/nginx/admin.cofarm.farm.access.log;
  error_log /var/log/nginx/admin.cofarm.farm.error.log;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 200m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control 'public, immutable' always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # The only unhashed file, so a stale copy pins the browser to an old bundle.
  location = /index.html {
    add_header Cache-Control 'no-cache' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_buffering off;
    proxy_request_buffering off;
  }

  location /health {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
