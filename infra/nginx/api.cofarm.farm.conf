server {
  listen 80;
  listen [::]:80;
  server_name api.cofarm.farm;

  access_log /var/log/nginx/api.cofarm.farm.access.log;
  error_log /var/log/nginx/api.cofarm.farm.error.log;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # MAX_VIDEO_BYTES in @cofarm/contracts. File bytes go straight to R2 on a
  # presigned PUT, so in practice this only has to clear the JSON bodies.
  client_max_body_size 200m;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/problem+json text/plain;

  location / {
    proxy_pass http://127.0.0.1:4020;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_buffering off;
    proxy_request_buffering off;
  }
}
